[pytest]
testpaths = tests test_recuperacion.py
markers =
    critico: casos críticos del plan (CP-01, CP-03, CP-22 a CP-25)
    unitaria: pruebas unitarias (nivel 1 del plan)
    integracion: pruebas de integración API + base de datos (nivel 2)
    sistema: casos CP-xx de sistema vía API (nivel 3)
    seguridad: pruebas de seguridad (nivel 5)
    caja_blanca: pruebas de caja blanca (cobertura de ramas, caminos y bucles)
    no_funcional: pruebas no funcionales
    rendimiento: tiempos de respuesta y carga
    fiabilidad: robustez, concurrencia, datos inválidos
    usabilidad: claridad de mensajes al usuario
    compatibilidad: formatos de datos, unicode, fechas
    bloqueado: caso no ejecutable aún (funcionalidad no implementada)
filterwarnings =
    ignore::DeprecationWarning
